[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchbot"
version = "0.1.0"
description = "Unified homelab + social media monitoring plugin for Hermes Agent"
requires-python = ">=3.11"
authors = [{name = "Piyush Mehta", email = "me@piyushmehta.com"}]
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.4.0"]
dashboard = ["flask>=3.1.3", "plotly>=6.9.0"]
twitter = ["tweepy>=4.17.0"]
all = ["watchbot[dashboard,twitter]"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Safety-critical rules only (pyflakes F, import/statement/syntax E4/E7/E9).
# This keeps `ruff check` green on any ruff version — newer ruff defaults
# enable modernization rules (UP, BLE, I001, ...) that this codebase predates.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import `watchbot.*` from src/. `pythonpath` puts src/ on sys.path so
# those imports resolve. `--import-mode=importlib` (via addopts — pytest only
# exposes it as a CLI flag) avoids pytest re-deriving tests as `watchbot.tests`,
# which collides with the root plugin bridge and broke collection with
# "No module named 'watchbot.tests'".
pythonpath = ["src"]
addopts = "--import-mode=importlib"
